<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <!-- Outer stroke / container shape -->
  <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chimney -->
    <path d="M 145 130 V 80 H 155 V 102" />
    
    <!-- House outline -->
    <path d="M 100 300 H 300 V 170 L 200 80 L 100 170 Z" />
    
    <!-- Aroma Steam Lines (3 curved streams coming out of the cup) -->
    <path d="M 175 185 C 175 140, 205 130, 245 100" stroke-width="10" />
    <path d="M 195 185 C 195 155, 230 145, 275 125" stroke-width="10" />
    <path d="M 215 185 C 215 168, 255 160, 290 148" stroke-width="10" />

    <!-- Coffee Cup -->
    <path d="M 150 185 H 250 V 250 C 250 280, 230 295, 200 295 C 170 295, 150 280, 150 250 Z" stroke-width="12" fill="none" />
    <!-- Cup Handle on left -->
    <path d="M 150 210 C 120 210, 120 260, 150 260" stroke-width="12" />
  </g>
  
  <!-- Text: SALEIN COFFEE HOUSE -->
  <text x="200" y="355" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="40" fill="currentColor" text-anchor="middle" letter-spacing="9">SALEIN</text>
  <text x="200" y="395" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="22" fill="currentColor" text-anchor="middle" letter-spacing="5">COFFEE HOUSE</text>
</svg>
